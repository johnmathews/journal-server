name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: johnmathews/journal-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Test
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing

      # Dependency-vulnerability gate (W19). Audits the exact pinned set
      # from uv.lock (exported to requirements format so pip-audit reads
      # the resolved versions rather than re-resolving). --disable-pip
      # stops pip-audit from installing anything; it only queries the
      # advisory DBs. Blocking by design: if an advisory lands, prefer
      # `uv lock --upgrade-package <name>` to a blanket --ignore-vuln.
      - name: Audit dependencies (pip-audit)
        run: |
          uv export --no-emit-project --format requirements-txt > /tmp/audit-reqs.txt
          uvx pip-audit -r /tmp/audit-reqs.txt --disable-pip

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    services:
      # ChromaVectorStore.__init__ connects synchronously, so the
      # workflow must wait for ChromaDB to be ready before invoking
      # the integration suite (Unit 5 of the code-quality refactor
      # plan calls this out explicitly). We poll the heartbeat
      # endpoint from the runner instead of relying on Docker's
      # built-in healthcheck — the chroma image historically lacked
      # curl, and a wait loop on the runner is straightforward and
      # self-contained.
      chromadb:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Wait for ChromaDB heartbeat
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v2/heartbeat >/dev/null 2>&1; then
              echo "ChromaDB ready after ${attempt} attempt(s)"
              exit 0
            fi
            echo "ChromaDB not ready yet (attempt ${attempt}/30)..."
            sleep 2
          done
          echo "ChromaDB did not become ready within 60s"
          exit 1

      - name: Integration tests (Chroma)
        env:
          CHROMADB_HOST: localhost
          CHROMADB_PORT: "8000"
        run: uv run pytest -m integration -v

  build-and-push:
    needs: [test, integration-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract ChromaDB metadata
        id: chromadb-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/johnmathews/journal-chromadb
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push ChromaDB image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.chromadb
          push: true
          tags: ${{ steps.chromadb-meta.outputs.tags }}
          labels: ${{ steps.chromadb-meta.outputs.labels }}
